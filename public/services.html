<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Services | Gaurai Hospital</title>
<meta name="description" content="Gaurai Hospital - experienced doctors, diagnostic tests and online appointment booking.">
<script>try{var t=localStorage.getItem('gh_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Serif+Devanagari:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="services">
<div id="site-header"></div>
<main id="main">
<section class="page-hero"><div class="wrap"><h1 data-i18n="sp_title">Services & tests</h1><p data-i18n="sp_sub">Browse our departments and every diagnostic test in one place.</p></div></section>

<section class="section"><div class="wrap">
  <h2 data-i18n="sp_dept_t">Departments</h2><div class="grid g4" id="deptGrid" style="margin-bottom:56px"></div>
  <h2 data-i18n="sp_tests_t">Diagnostic tests</h2>
  <div class="toolbar"><input id="testSearch" type="search" data-i18n-ph="sp_search" placeholder="Search a test, e.g. CBC" aria-label="Search tests"><div class="chips" id="catChips"></div></div>
  <div class="table-wrap"><table><thead><tr><th data-i18n="th_test">Test</th><th data-i18n="th_cat">Category</th><th data-i18n="th_price">Price</th><th data-i18n="th_tat">Report</th></tr></thead><tbody id="testBody"></tbody></table></div>
  <p class="muted small" style="margin-top:12px" data-i18n="sp_note">Prices are indicative and may change. Please confirm at the reception.</p>
</div></section>

</main>
<div id="site-footer"></div>
<script src="js/i18n.js"></script>
<script src="js/script.js"></script>
</body>
</html>
